[package]
name = "golem-websearch"
version = "1.0.0"
edition = "2021"

[dependencies]
wit-bindgen = { version = "0.42.1", features = ["realloc"] }
golem-rust = { version = "1.2.1", features = ["default", "durability"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasi-logger = "0.1"
log = "0.4"

[features]
default = ["durability"]
durability = ["golem-rust/durability"] 