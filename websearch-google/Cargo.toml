[package]
name = "websearch-google"
version = "1.0.0"
edition = "2021"

[dependencies]
wit-bindgen = { version = "0.42.1", features = ["realloc"] }
golem-websearch = { path = "../websearch" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasi-logger = "0.1"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["sync", "macros", "io-util", "rt", "time"] }
futures = "0.3"
url = "2.0"

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
target = { path = "../wit-websearch", world = "web-search-library" }

[profile.release]
opt-level = "s"
lto = true